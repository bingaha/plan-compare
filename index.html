<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Agent 套餐价格对比</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e4e7ec; --line2:#cfd4dc;
  --text:#17202e; --muted:#667085; --accent:#2563eb;
  --best-bg:#e6f6ec; --best-fg:#177245;
  --danger:#d92d20; --danger-bg:#fef3f2; --danger-line:#fecdca;
}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600}
.modetag{font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--muted)}
.spacer{flex:1}
button{font:inherit;border-radius:6px;cursor:pointer}
.ghost{background:var(--card);border:1px solid var(--line2);color:var(--text);padding:6px 12px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.status{font-size:12px;color:var(--muted)}
.status.saved{color:var(--best-fg)}
.toggle{display:flex;align-items:center;gap:5px;color:var(--text);cursor:pointer;user-select:none}
.banner{margin:12px 16px;padding:10px 14px;border:1px solid var(--danger-line);background:var(--danger-bg);color:var(--danger);border-radius:8px}
.banner.hidden{display:none}
.banner ul{margin:6px 0 0;padding-left:18px}
main{padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.globals{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.glabel{font-weight:600}
.globals label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.globals input{width:76px;border-color:var(--line2)}
.hint{color:var(--muted);font-size:12px}
input,select{font:inherit;color:var(--text);background:#fff;border:1px solid transparent;border-radius:4px;padding:3px 6px}
input:hover,select:hover{border-color:var(--line2)}
input:focus,select:focus{border-color:var(--accent);outline:none}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.srcinput{width:140px;border-color:var(--line2)}
.tablewrap{overflow:auto;max-height:calc(100vh - 185px);border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 6px;height:32px;white-space:nowrap;background:var(--card)}
th:last-child,td:last-child{border-right:none}
thead th{position:sticky;top:0;z-index:5;background:#f9fafb;font-weight:600;text-align:left;user-select:none;cursor:pointer}
thead tr.frow th{top:32px;cursor:default}
thead tr.frow th input{width:100%}
.arr{color:var(--accent);font-size:11px;margin-left:2px}
.delsrc{margin-left:6px;font-size:11px;color:var(--muted);background:none;border:none;padding:0 2px}
.delsrc:hover{color:var(--danger)}
tbody tr:hover td{background:#f5f8ff}
tr:hover td.best{background:var(--best-bg)}
td input,td select{border-color:transparent}
td input:hover,td select:hover{border-color:var(--line2)}
td input[type=number]{width:64px}
td input[type=text]{width:100%}
td .na{color:#c2c8d2}
td.calc{font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
td.k-mtoksPerYuan{font-weight:600}
td.best{background:var(--best-bg)!important;color:var(--best-fg)}
td.scorecell{min-width:84px}
td.wide{min-width:220px}
.s0{position:sticky;left:0;z-index:2;width:88px;min-width:88px;max-width:88px}
.s1{position:sticky;left:88px;z-index:2;width:130px;min-width:130px;max-width:130px}
.s2{position:sticky;left:218px;z-index:2;width:118px;min-width:118px;max-width:118px}
thead th.s0,thead th.s1,thead th.s2{z-index:7}
td.delcell,th.delcol{min-width:36px;text-align:center}
button.del{font-size:11px;color:var(--muted);background:none;border:none;padding:2px 4px}
button.del:hover{color:var(--danger)}
td.empty{text-align:center;color:var(--muted);padding:24px}
</style>
</head>
<body>
<header id="topbar">
  <h1>Agent 套餐价格对比</h1>
  <span id="modetag" class="modetag hidden" style="display:none">导入数据</span>
  <span id="status" class="status"></span>
  <span class="spacer"></span>
  <label class="toggle" title="隐藏内置套餐行，仅显示你自己添加的行"><input type="checkbox" id="hideBuiltin"> 只看自己录入的</label>
  <input id="newSource" class="srcinput" placeholder="新评分源名称">
  <button id="btnAddSource" class="ghost">添加评分源</button>
  <button id="btnAddPlan" class="ghost">添加套餐行</button>
  <button id="btnRestore" class="ghost" title="清空浏览器本地保存的全部修改，回到内置数据">恢复内置默认</button>
  <button id="btnImport" class="ghost" title="从导出的 JSON 文件恢复数据">导入</button>
  <button id="btnExport" class="ghost" title="把当前全部数据（含你的修改）导出为 JSON 文件">导出</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>
<div id="banner" class="banner hidden"></div>
<main>
  <section class="card globals">
    <span class="glabel">全局用量混合比</span>
    <label>输入占比 <input id="g-inputRatio" type="number" step="0.01"></label>
    <label>缓存命中率 <input id="g-cacheHitRate" type="number" step="0.01"></label>
    <label>输出占比 <input id="g-outputRatio" type="number" step="0.01"></label>
    <span class="hint">综合单价 = 输入占比 ×（命中率 × 缓存价 + (1−命中率) × 输入价）+ 输出占比 × 输出价；消耗/价格倍率默认 1，>1 表示计费放大或加价</span>
  </section>
  <div class="tablewrap"><table id="tbl"></table></div>
</main>

<script src="data.js"></script>
<script type="module">
'use strict';
const $ = (s) => document.querySelector(s);
const tbl = $('#tbl'), banner = $('#banner'), statusEl = $('#status'), modeTag = $('#modetag');
const LSK = 'plan-compare:overlay:v1';

const TEXT_COLS = ['platform', 'plan', 'model', 'note'];
const CALC = ['monthlyCost', 'monthlyUsage', 'blended', 'availMtoks', 'effectiveMtoks', 'mtoksPerYuan'];
const MONTHS = { month: 1, quarter: 3, year: 12 };

const BASE_COLS = [
  { k: 'platform', label: '平台', type: 'text', s: 0 },
  { k: 'plan', label: '套餐', type: 'text', s: 1 },
  { k: 'model', label: '模型', type: 'text', s: 2 },
  { k: 'mode', label: '方式', type: 'select', opts: [['quota', '额度制'], ['usage', '用量制']], title: '额度制：按套餐内额度换算总用量；用量制：直接填实际可用量' },
  { k: 'price', label: '购买价(元)', type: 'num', title: '实付人民币：单期价格（月价或资源包总价，与用量M同周期）' },
  { k: 'period', label: '周期', type: 'select', opts: [['month', '月'], ['quarter', '季'], ['year', '年']] },
  { k: 'consumeRate', label: '消耗倍率', type: 'num', title: '名义用 1M 按 X 计费（如高峰期 1M 按 2M 计费则填 2）' },
  { k: 'priceRate', label: '价格倍率', type: 'num', title: '名义价格 × 该倍率 = 实际价格（如 2 折渠道填 0.2）' },
  { k: 'monthlyCost', label: '月均成本(元)', calc: true, money: true },
  { k: 'usageM', label: '用量M(Mtok/周期)', type: 'num', modeOnly: 'usage', title: '该周期内实际可用的名义 token 量' },
  { k: 'monthlyUsage', label: '月均用量(Mtok)', calc: true },
  { k: 'quota', label: '套餐内额度', type: 'num', modeOnly: 'quota', title: '按套餐内计价币种填写（与下面三个单价同币种）' },
  { k: 'priceIn', label: '输入价', type: 'num', modeOnly: 'quota', title: '每 Mtok，与额度同币种' },
  { k: 'priceOut', label: '输出价', type: 'num', modeOnly: 'quota', title: '每 Mtok，与额度同币种' },
  { k: 'priceCache', label: '缓存价', type: 'num', modeOnly: 'quota', title: '缓存命中每 Mtok，与额度同币种' },
  { k: 'blended', label: '综合单价', calc: true, modeOnly: 'quota', title: '按全局混合比折算的每 Mtok 综合价' },
  { k: 'availMtoks', label: '可用Mtoks', calc: true, modeOnly: 'quota', title: '额度 ÷ (综合单价 × 价格倍率)' },
  { k: 'effectiveMtoks', label: '有效Mtoks', calc: true, title: '可用 ÷ 消耗倍率' },
  { k: 'mtoksPerYuan', label: 'Mtoks/元', calc: true, title: '有效Mtoks ÷ 实付金额' },
  { k: 'note', label: '备注', type: 'text', wide: true },
];
const DEL_COL = { k: '_del', label: '' };

let dirtyTimer = null, sortKey = 'mtoksPerYuan', sortDir = 'desc';
let filters = {}, filterTimer = null, lastFilterKey = null;

// ---------- 数据层：内置数据 ⊕ localStorage 覆盖层 ----------

const BUILTIN = window.BUILTIN_DATA;

const freshOverlay = () => ({
  version: 1,
  customRows: [],       // 用户新建的行（含 origin:'custom'）
  rowEdits: {},         // 对内置行的字段级修改：{id: {field: value}}，与内置值相同则移除
  deletedRowIds: [],    // 被删除的内置行 id
  scoreEdits: {},       // 对内置评分源数值的修改/新增：{src: {model: number|null}}，null 表示删除
  customSources: {},    // 用户新增的评分源：{src: {model: number}}
  deletedSources: [],   // 被删除的内置评分源
  globalEdits: {},      // 全局参数修改
  hideBuiltin: false,   // 只看自己录入的
  fullData: null        // 导入模式：非 null 时完全替代内置⊕覆盖层
});

let overlay = freshOverlay();
let storageOk = true;

function loadOverlay() {
  let saved = null;
  try { saved = localStorage.getItem(LSK); } catch (e) { storageOk = false; }
  if (saved == null) return;
  try {
    const parsed = JSON.parse(saved);
    if (parsed && typeof parsed === 'object') overlay = { ...freshOverlay(), ...parsed };
  } catch (e) {
    showBanner(['浏览器本地保存的数据无法解析，已按内置数据启动（原数据保留在 localStorage，可用"恢复内置默认"清掉）。']);
  }
}

function persist() {
  try {
    localStorage.setItem(LSK, JSON.stringify(overlay));
    statusEl.textContent = '已自动保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    statusEl.className = 'status saved';
  } catch (e) {
    storageOk = false;
    statusEl.textContent = '';
    showBanner(['localStorage 不可用（' + e.message + '）：本次修改只在当前页面内有效，刷新后会丢失。']);
  }
}
const markDirty = () => { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(persist, 400); };

const effGlobal = () => overlay.fullData
  ? { ...overlay.fullData.global }
  : { ...BUILTIN.global, ...overlay.globalEdits };

const effScores = () => {
  if (overlay.fullData) return overlay.fullData.scores || {};
  const s = {};
  for (const [src, vals] of Object.entries(BUILTIN.scores || {})) {
    if (overlay.deletedSources.includes(src)) continue;
    const t = { ...vals };
    for (const [m, v] of Object.entries(overlay.scoreEdits[src] || {})) { if (v == null) delete t[m]; else t[m] = v; }
    s[src] = t;
  }
  for (const [src, vals] of Object.entries(overlay.customSources)) s[src] = { ...vals };
  return s;
};

const effPlans = () => {
  if (overlay.fullData) return overlay.fullData.plans;
  const base = BUILTIN.plans
    .filter((p) => !overlay.deletedRowIds.includes(p.id))
    .map((p) => ({ ...p, ...(overlay.rowEdits[p.id] || {}), origin: 'builtin' }));
  return [...base, ...overlay.customRows.map((r) => ({ ...r, origin: 'custom' }))];
};

function locateRow(id) {
  if (overlay.fullData) {
    const obj = overlay.fullData.plans.find((p) => p.id === id);
    return obj ? { obj, origin: obj.origin || 'builtin' } : null;
  }
  const c = overlay.customRows.find((p) => p.id === id);
  if (c) return { obj: c, origin: 'custom' };
  if (overlay.deletedRowIds.includes(id)) return null;
  const b = BUILTIN.plans.find((p) => p.id === id);
  return b ? { obj: b, origin: 'builtin' } : null;
}

function setRowField(loc, field, value) {
  if (overlay.fullData || loc.origin === 'custom') { loc.obj[field] = value; return; }
  const cur = (overlay.rowEdits[loc.obj.id] ??= {});
  const bval = BUILTIN.plans.find((p) => p.id === loc.obj.id)?.[field];
  if (value === bval) delete cur[field]; else cur[field] = value;
}

function deleteRow(id) {
  if (overlay.fullData) {
    const i = overlay.fullData.plans.findIndex((p) => p.id === id);
    if (i >= 0) overlay.fullData.plans.splice(i, 1);
    return;
  }
  const ci = overlay.customRows.findIndex((p) => p.id === id);
  if (ci >= 0) { overlay.customRows.splice(ci, 1); return; }
  if (!overlay.deletedRowIds.includes(id)) overlay.deletedRowIds.push(id);
  delete overlay.rowEdits[id];
}

function addRow(template) {
  if (overlay.fullData) overlay.fullData.plans.push(template);
  else overlay.customRows.push(template);
}

function setScore(src, model, raw) {
  if (raw === '') {
    if (overlay.fullData) { if (overlay.fullData.scores[src]) delete overlay.fullData.scores[src][model]; return; }
    if (overlay.customSources[src]) { delete overlay.customSources[src][model]; return; }
    (overlay.scoreEdits[src] ??= {})[model] = null;
    return;
  }
  const n = Number(raw);
  if (!isFinite(n)) return;
  if (overlay.fullData) { (overlay.fullData.scores[src] ??= {})[model] = n; return; }
  if (overlay.customSources[src]) { overlay.customSources[src][model] = n; return; }
  const cur = (overlay.scoreEdits[src] ??= {});
  if (BUILTIN.scores?.[src]?.[model] === n) delete cur[model]; else cur[model] = n;
}

function deleteScoreSource(src) {
  if (overlay.fullData) { delete overlay.fullData.scores[src]; return; }
  if (overlay.customSources[src]) { delete overlay.customSources[src]; return; }
  if (!overlay.deletedSources.includes(src)) overlay.deletedSources.push(src);
  delete overlay.scoreEdits[src];
}

function setGlobal(field, value) {
  if (overlay.fullData) { overlay.fullData.global[field] = value; return; }
  const bval = BUILTIN.global?.[field];
  if (value === bval) delete overlay.globalEdits[field]; else overlay.globalEdits[field] = value;
}

// ---------- 计算与渲染 ----------

const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const nz = (v, d) => (v == null || v === '' ? d : Number(v));
const scoreCols = () => Object.keys(effScores()).map((src) => ({ k: 'score:' + src, label: src, type: 'num', score: true, src }));
const allCols = () => [...BASE_COLS, ...scoreCols(), DEL_COL];
const fmt = (v, money) => {
  if (typeof v !== 'number' || !isFinite(v)) return '—';
  if (money) return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (Math.abs(v) >= 10000) return v.toLocaleString('zh-CN', { maximumFractionDigits: 0 });
  return String(Number(v.toPrecision(4)));
};

function compute(p) {
  const g = effGlobal();
  const m = MONTHS[p.period] || 1;
  const pr = nz(p.priceRate, 1), cr = nz(p.consumeRate, 1);
  const price = nz(p.price, NaN);
  const ir = nz(g.inputRatio, NaN), hr = nz(g.cacheHitRate, NaN), or = nz(g.outputRatio, NaN);
  const out = { monthlyCost: null, monthlyUsage: null, blended: null, availMtoks: null, effectiveMtoks: null, mtoksPerYuan: null };
  out.monthlyCost = price * pr / m;
  if (p.mode === 'usage') {
    const um = nz(p.usageM, NaN);
    if (isFinite(um) && um > 0) {
      const eff = um / cr;
      out.effectiveMtoks = eff;
      out.monthlyUsage = eff / m;
      out.mtoksPerYuan = eff / (price * pr);
    }
  } else {
    const pin = nz(p.priceIn, NaN), pout = nz(p.priceOut, NaN), pc = nz(p.priceCache, NaN), q = nz(p.quota, NaN);
    if ([ir, hr, or, pin, pout, pc].every(isFinite)) {
      const b = ir * (hr * pc + (1 - hr) * pin) + or * pout;
      out.blended = b;
      if (isFinite(q) && q > 0 && b > 0) {
        const avail = q / (b * pr);
        const eff = avail / cr;
        out.availMtoks = avail;
        out.effectiveMtoks = eff;
        out.monthlyUsage = eff / m;
        out.mtoksPerYuan = eff / price;
      }
    }
  }
  return out;
}

function visibleSorted() {
  let arr = effPlans();
  if (overlay.hideBuiltin) arr = arr.filter((p) => (p.origin || 'builtin') !== 'builtin');
  arr = arr.map((p) => ({ p, c: compute(p) }));
  for (const [k, f] of Object.entries(filters)) {
    if (!f) continue;
    if (TEXT_COLS.includes(k)) {
      const needle = String(f).toLowerCase();
      arr = arr.filter((x) => String(x.p[k] ?? '').toLowerCase().includes(needle));
    } else if (k.startsWith('score:')) {
      const src = k.slice(6), min = parseFloat(f);
      if (isFinite(min)) arr = arr.filter((x) => { const v = effScores()[src]?.[x.p.model]; return typeof v === 'number' && v >= min; });
    } else {
      const min = parseFloat(f);
      if (isFinite(min)) arr = arr.filter((x) => { const v = CALC.includes(k) ? x.c[k] : x.p[k]; return typeof v === 'number' && isFinite(v) && v >= min; });
    }
  }
  const scoresNow = effScores();
  const dir = sortDir === 'asc' ? 1 : -1;
  const val = (x) => sortKey.startsWith('score:') ? scoresNow[sortKey.slice(6)]?.[x.p.model]
    : CALC.includes(sortKey) ? x.c[sortKey] : x.p[sortKey];
  arr.sort((a, b) => {
    const va = val(a), vb = val(b);
    const an = typeof va === 'number' && isFinite(va), bn = typeof vb === 'number' && isFinite(vb);
    if (an && bn) return (va - vb) * dir;
    if (an) return -1;
    if (bn) return 1;
    return String(va ?? '').localeCompare(String(vb ?? ''), 'zh') * dir;
  });
  return arr;
}

const numInput = (v) => `<input type="number" step="any" value="${v == null ? '' : v}">`;

function rowHtml(p, c, cols) {
  let h = `<tr data-id="${esc(p.id)}" data-origin="${esc(p.origin || 'builtin')}">`;
  for (const col of cols) {
    const stickyCls = col.s !== undefined ? ' s' + col.s : '';
    if (col.k === '_del') { h += `<td class="delcell"><button class="del" title="删除该行">删</button></td>`; continue; }
    if (col.score) {
      const v = effScores()[col.src]?.[p.model];
      h += `<td class="scorecell${stickyCls}" data-k="${esc(col.k)}">${numInput(v ?? null)}</td>`;
      continue;
    }
    if (col.calc) {
      const na = col.modeOnly && p.mode !== col.modeOnly;
      const v = na ? null : c[col.k];
      h += `<td class="calc k-${col.k}${stickyCls}" data-k="${col.k}" data-v="${v == null ? '' : v}">${na ? '<span class="na">—</span>' : esc(fmt(v, col.money))}</td>`;
      continue;
    }
    if (col.modeOnly && p.mode !== col.modeOnly) { h += `<td${stickyCls ? ` class="${stickyCls.trim()}"` : ''}><span class="na">—</span></td>`; continue; }
    if (col.type === 'select') {
      h += `<td${stickyCls ? ` class="${stickyCls.trim()}"` : ''} data-k="${col.k}"><select>${col.opts.map(([v, l]) => `<option value="${v}"${p[col.k] === v ? ' selected' : ''}>${l}</option>`).join('')}</select></td>`;
      continue;
    }
    if (col.type === 'num') { h += `<td${stickyCls ? ` class="${stickyCls.trim()}"` : ''} data-k="${col.k}">${numInput(p[col.k])}</td>`; continue; }
    h += `<td class="${col.wide ? 'wide' : ''}${stickyCls}" data-k="${col.k}"><input type="text" value="${esc(p[col.k] ?? '')}"></td>`;
  }
  return h + '</tr>';
}

function render() {
  const cols = allCols();
  let h = '<thead><tr>';
  for (const c of cols) {
    if (c.k === '_del') { h += '<th class="delcol"></th>'; continue; }
    const sticky = c.s !== undefined ? ` class="s${c.s}"` : '';
    const arr = sortKey === c.k ? `<span class="arr">${sortDir === 'asc' ? '↑' : '↓'}</span>` : '';
    const delsrc = c.score ? `<button class="delsrc" data-src="${esc(c.src)}" title="删除该评分源">删</button>` : '';
    const tip = c.title ? ` title="${esc(c.title)}"` : '';
    h += `<th data-k="${esc(c.k)}"${sticky}${tip}>${esc(c.label)}${arr}${delsrc}</th>`;
  }
  h += '</tr><tr class="frow">';
  for (const c of cols) {
    if (c.k === '_del') { h += '<th class="delcol"></th>'; continue; }
    const sticky = c.s !== undefined ? ` class="s${c.s}"` : '';
    const f = filters[c.k] || '';
    if (TEXT_COLS.includes(c.k) || c.calc || c.type === 'num' || c.score)
      h += `<th${sticky}><input data-fk="${esc(c.k)}" value="${esc(f)}" placeholder="${c.type === 'text' ? '包含' : '≥'}"></th>`;
    else h += `<th${sticky}></th>`;
  }
  h += '</tr></thead><tbody>';
  const rows = visibleSorted();
  if (!rows.length) h += `<tr><td class="empty" colspan="${cols.length}">${overlay.hideBuiltin ? '没有你自己录入的行，点右上角"添加套餐行"' : '无匹配行'}</td></tr>`;
  for (const { p, c } of rows) h += rowHtml(p, c, cols);
  h += '</tbody>';
  tbl.innerHTML = h;
  if (lastFilterKey) {
    const el = tbl.querySelector(`input[data-fk="${CSS.escape(lastFilterKey)}"]`);
    if (el) { el.focus(); const n = el.value.length; el.setSelectionRange(n, n); }
  }
  applyBest();
}

function updateComputed() {
  const byId = new Map(effPlans().map((p) => [p.id, p]));
  for (const tr of tbl.querySelectorAll('tbody tr[data-id]')) {
    const p = byId.get(tr.dataset.id);
    if (!p) continue;
    const c = compute(p);
    for (const k of CALC) {
      const cell = tr.querySelector(`td.calc.k-${k}`);
      if (!cell) continue;
      const na = cell.querySelector('.na') != null;
      const v = na ? null : c[k];
      cell.dataset.v = v == null ? '' : v;
      const col = BASE_COLS.find((x) => x.k === k);
      cell.textContent = fmt(v, col?.money);
      if (na) cell.innerHTML = '<span class="na">—</span>';
    }
  }
  applyBest();
}

function applyBest() {
  let best = -Infinity, cell = null;
  for (const y of tbl.querySelectorAll('tbody td.k-mtoksPerYuan')) {
    y.classList.remove('best');
    const v = Number(y.dataset.v);
    if (y.dataset.v !== '' && isFinite(v) && v > best) { best = v; cell = y; }
  }
  if (cell) cell.classList.add('best');
}

function showBanner(errs) {
  if (!errs || !errs.length) { banner.classList.add('hidden'); banner.innerHTML = ''; return; }
  banner.innerHTML = '<b>提示：</b><ul>' + errs.map((e) => `<li>${esc(e)}</li>`).join('') + '</ul>';
  banner.classList.remove('hidden');
}

// ---------- 事件 ----------

tbl.addEventListener('click', (e) => {
  const delsrc = e.target.closest('.delsrc');
  if (delsrc) { deleteScoreSource(delsrc.dataset.src); markDirty(); render(); return; }
  const del = e.target.closest('button.del');
  if (del) { deleteRow(del.closest('tr[data-id]').dataset.id); markDirty(); render(); return; }
  const th = e.target.closest('thead th[data-k]');
  if (th && th.dataset.k !== '_del') {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = k; const col = allCols().find((c) => c.k === k); sortDir = col?.type === 'text' ? 'asc' : 'desc'; }
    render();
  }
});

tbl.addEventListener('input', (e) => {
  const t = e.target;
  if (t.hasAttribute('data-fk')) {
    filters[t.dataset.fk] = t.value;
    lastFilterKey = t.dataset.fk;
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => render(), 150);
    return;
  }
  const td = t.closest('td[data-k]');
  if (!td || td.classList.contains('calc')) return;
  const tr = t.closest('tr[data-id]');
  const loc = locateRow(tr?.dataset.id);
  if (!loc) return;
  const k = td.dataset.k;
  if (k.startsWith('score:')) { setScore(k.slice(6), loc.obj.model, t.value.trim()); markDirty(); return; }
  if (t.tagName === 'SELECT') return;
  let v;
  if (t.type === 'number') v = t.value === '' ? null : Number(t.value);
  else v = t.value;
  setRowField(loc, k, v);
  markDirty();
  if (t.type === 'number') updateComputed();
});

tbl.addEventListener('change', (e) => {
  const t = e.target;
  const td = t.closest('td[data-k]');
  if (!td) return;
  const loc = locateRow(t.closest('tr[data-id]')?.dataset.id);
  if (!loc) return;
  const k = td.dataset.k;
  if (t.tagName === 'SELECT') {
    setRowField(loc, k, t.value);
    markDirty();
    if (k === 'mode') render(); else updateComputed();
    return;
  }
  if (k === 'model') render();
});

for (const k of ['inputRatio', 'cacheHitRate', 'outputRatio']) {
  $('#g-' + k).addEventListener('input', (e) => {
    setGlobal(k, e.target.value === '' ? null : Number(e.target.value));
    markDirty();
    updateComputed();
  });
}

$('#hideBuiltin').addEventListener('change', (e) => {
  overlay.hideBuiltin = e.target.checked;
  markDirty();
  render();
});

$('#btnAddPlan').addEventListener('click', () => {
  addRow({ id: crypto.randomUUID(), origin: 'custom', platform: '', plan: '', model: '', mode: 'quota', price: null, period: 'month', usageM: null, quota: null, priceIn: null, priceOut: null, priceCache: null, consumeRate: 1, priceRate: 1, note: '' });
  markDirty();
  render();
});

$('#btnAddSource').addEventListener('click', () => {
  const el = $('#newSource');
  const name = el.value.trim();
  if (!name) return;
  if (overlay.fullData) { if (!overlay.fullData.scores[name]) overlay.fullData.scores[name] = {}; }
  else if (!overlay.customSources[name] && !BUILTIN.scores?.[name]) overlay.customSources[name] = {};
  else if (BUILTIN.scores?.[name] && !overlay.deletedSources.includes(name)) { el.value = ''; return; }
  else if (overlay.deletedSources.includes(name)) overlay.deletedSources = overlay.deletedSources.filter((s) => s !== name);
  el.value = '';
  markDirty();
  render();
});

$('#btnRestore').addEventListener('click', () => {
  if (!confirm('将清空浏览器本地保存的全部修改（含自定义行和导入的数据），恢复为内置数据。确定？')) return;
  overlay = freshOverlay();
  persist();
  init();
  showBanner([]);
});

$('#btnExport').addEventListener('click', () => {
  const data = {
    kind: 'plan-compare-data',
    version: 1,
    exportedAt: new Date().toISOString(),
    global: effGlobal(),
    plans: effPlans().map((p) => ({ ...p, origin: p.origin || 'builtin' })),
    scores: effScores()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plan-compare-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('#btnImport').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const problems = [];
    if (!data || typeof data !== 'object') problems.push('根节点必须是对象');
    else {
      if (!Array.isArray(data.plans)) problems.push('缺少 plans 数组');
      if (!data.global || typeof data.global !== 'object' || Array.isArray(data.global)) problems.push('缺少 global 对象');
      if (data.scores !== undefined && (typeof data.scores !== 'object' || data.scores === null || Array.isArray(data.scores))) problems.push('scores 必须是对象');
    }
    if (problems.length) throw new Error(problems.join('；'));
    data.scores ??= {};
    for (const p of data.plans) { p.id ??= crypto.randomUUID(); p.origin ??= 'builtin'; }
    overlay = { ...freshOverlay(), fullData: data };
    persist();
    init();
    showBanner([]);
  } catch (err) {
    showBanner(['导入失败：' + err.message]);
  }
});

// ---------- 初始化 ----------

function init() {
  const g = effGlobal();
  for (const k of ['inputRatio', 'cacheHitRate', 'outputRatio']) $('#g-' + k).value = g[k] ?? '';
  $('#hideBuiltin').checked = !!overlay.hideBuiltin;
  modeTag.style.display = overlay.fullData ? '' : 'none';
  filters = {};
  lastFilterKey = null;
  render();
  statusEl.textContent = '数据自动保存于浏览器本地';
  statusEl.className = 'status';
}

loadOverlay();
if (!BUILTIN || typeof BUILTIN !== 'object' || !Array.isArray(BUILTIN.plans)) {
  showBanner(['data.js 未加载或缺少 BUILTIN_DATA/plans，请检查 data.js 是否与 index.html 在同一目录。']);
} else {
  init();
}
</script>
</body>
</html>
